name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install build
        run: python -m pip install --upgrade pip build

      - name: Install project
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          extras = set()
          in_optional_deps = False
          for line in text.splitlines():
              stripped = line.strip()
              if stripped == "[project.optional-dependencies]":
                  in_optional_deps = True
                  continue
              if in_optional_deps and stripped.startswith("[") and stripped.endswith("]"):
                  break
              if in_optional_deps:
                  match = re.match(r"([A-Za-z0-9_-]+)\s*=\s*\[", stripped)
                  if match:
                      extras.add(match.group(1))
          enabled = [name for name in ("lab", "dev") if name in extras]
          target = f'.[{",".join(enabled)}]' if enabled else "."
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", target])
          PY

      - name: Smoke test public imports
        shell: bash
        run: |
          python - <<'PY'
          import XController as XController_pkg
          from XController import (
              ActionResult,
              ControllerSettings,
              LoginState,
              MediaCaptureData,
              ObservedPostData,
              SyncXController,
              XController as XControllerClass,
          )

          assert XController_pkg.__version__
          assert ActionResult
          assert ControllerSettings
          assert LoginState
          assert MediaCaptureData
          assert ObservedPostData
          assert SyncXController
          assert XControllerClass
          PY

      - name: Lint source and tests
        run: python -m ruff check .

      - name: Run tests with warnings as errors
        run: python -W error -m pytest -q

      - name: Build package artifacts
        run: python -m build

      - name: Install and smoke test built wheel
        shell: bash
        run: |
          python -m pip uninstall -y XController
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          from importlib.resources import files

          import XController
          from XController import ControllerSettings, SyncXController

          assert XController.__version__
          assert ControllerSettings
          assert SyncXController
          assert files("XController").joinpath("py.typed").is_file()
          PY
